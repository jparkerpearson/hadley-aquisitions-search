<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hadley</title>
    <meta name="description" content="Contact Hadley.">
    <link rel="icon" type="image/png" sizes="128x128" href="assets/favicon-dark-blue.png">
    <link rel="stylesheet" href="assets/site.css">
    <script src="assets/backend.js" defer></script>
    <script src="assets/site.js" defer></script>
    <script src="assets/contact.js" defer></script>

<body class="contact-page inner-page">
<a class="skip-link" href="#main">Skip to content</a>
<nav class="site-nav" aria-label="Main navigation">
    <a href="./" class="logo" aria-label="Hadley home"><img src="assets/hadley-logo-blue-transparent.webp" alt="Hadley"></a>
    <div class="nav-right">
        <a href="careers.html" class="nav-link">Careers</a>
        <a href="contact.html" class="nav-cta" aria-current="page">Contact</a>
    </div>
</nav>

<main id="main">
    <section class="contact-section" aria-labelledby="contact-title">
        <h1 class="contact-title" id="contact-title">Contact</h1>
        <form class="contact-form" id="contact-form" novalidate hidden>
            <div class="contact-fields">
                <div class="contact-field">
                    <label for="contact-name">Name</label>
                    <input id="contact-name" name="name" type="text" autocomplete="name" maxlength="160" required aria-describedby="error-name">
                    <span class="contact-field-error" id="error-name"></span>
                </div>
                <div class="contact-field">
                    <label for="contact-email">Work Email</label>
                    <input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254" required aria-describedby="error-email">
                    <span class="contact-field-error" id="error-email"></span>
                </div>
                <div class="contact-field contact-field--interest">
                    <label for="contact-interest">Area of Interest</label>
                    <input id="contact-interest" name="interest" type="text" maxlength="500" aria-describedby="error-interest">
                    <span class="contact-field-error" id="error-interest"></span>
                </div>
            </div>
            <div class="hp" aria-hidden="true">
                <label for="contact-website">Website</label>
                <input id="contact-website" name="website" type="text" tabindex="-1" autocomplete="off">
            </div>
            <div class="contact-form-footer">
                <p class="contact-status" id="contact-status" role="alert" aria-live="assertive"></p>
                <button class="contact-submit" id="contact-submit" type="submit">Send</button>
            </div>
        </form>
        <p class="contact-success" id="contact-success" role="status" tabindex="-1" hidden>Thanks. Your message has been received.</p>
        <noscript><p class="contact-noscript">This form requires JavaScript to submit.</p></noscript>
    </section>
</main>

</body>
</html>
